<h1>요미의 방 · 에셋 검토</h1>
<p>시간대를 바꾸거나 가구 레이어를 숨겨 배경, 실제 투명 영역, 배치를 확인할 수 있어요.</p>
<div class="toolbar" id="times"><button class="active" data-time="Morning">아침</button><button data-time="Noon">점심</button><button data-time="Evening">저녁</button><button data-time="Night">밤</button></div>
<div class="toolbar toggle"><label><input type="checkbox" data-target="Door" checked> 문</label><label><input type="checkbox" data-target="Phone" checked> 탁자·핸드폰</label><label><input type="checkbox" data-target="Computer" checked> 컴퓨터</label><label><input type="checkbox" data-target="Bed" checked> 침대</label><label><input type="checkbox" data-target="zone"> 요미 예약 영역</label><label><input type="checkbox" data-target="status"> 상태 카드 영역</label></div>
<div class="scene"><img id="background" src="../../../../Assets/Resources/DatingSim/YomiRoom/PointClick/Morning/Room.png" alt="방 배경"><img id="Door" src="../../../../Assets/Resources/DatingSim/YomiRoom/PointClick/Door.png" alt="문"><img id="Phone" src="../../../../Assets/Resources/DatingSim/YomiRoom/PointClick/Phone.png" alt="탁자와 핸드폰"><img id="Computer" src="../../../../Assets/Resources/DatingSim/YomiRoom/PointClick/Computer.png" alt="컴퓨터"><img id="Bed" src="../../../../Assets/Resources/DatingSim/YomiRoom/PointClick/Bed.png" alt="침대"><div id="zone" class="zone hidden"></div><div id="status" class="ui-zone hidden">상태 카드 영역</div></div>
